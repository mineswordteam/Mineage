<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mineage check</title></head>
<body style="background:#060810;color:#e8ecf5;font:14px Tahoma,sans-serif;padding:16px;line-height:1.9">
<h3>بررسی فایل‌ها و مدل‌های Mineage</h3>
<p>صبر کنید تا بنویسد DONE، بعد از کل این صفحه اسکرین‌شات بفرستید.</p>
<pre id="o" style="white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;font-size:12px"></pre>
<script>
const o=document.getElementById("o"), log=m=>{ o.textContent+=m+"\n"; };
const F=["face-api.js","human.js","age_gender_model.json","age_gender_model.bin","blazeface.json","blazeface.bin","facemesh.json","facemesh.bin","faceres.json","faceres.bin","sw.js","manifest.json"];
const ld=src=>new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script load failed")); document.head.appendChild(s); });
(async()=>{
  log("page: "+location.href);
  for(const f of F){
    try{ const r=await fetch(f,{cache:"no-store"}); const b=await r.arrayBuffer(); const t=r.headers.get("content-type")||"";
      log((r.ok&&b.byteLength>500&&!/html/.test(t)?"OK   ":"FAIL ")+f+"  status="+r.status+"  size="+b.byteLength+"  type="+t);
    }catch(e){ log("FAIL "+f+"  "+e.message); }
  }
  try{ await ld("face-api.js"); log("OK   face-api.js runs: faceapi="+typeof faceapi); }catch(e){ log("FAIL face-api.js: "+e.message); }
  try{ await ld("human.js"); log("OK   human.js runs: Human="+typeof Human); }catch(e){ log("FAIL human.js: "+e.message); }
  try{ await faceapi.tf.setBackend("webgl"); await faceapi.tf.ready(); log("OK   backend="+faceapi.tf.getBackend()); }catch(e){ log("FAIL backend: "+(e&&e.message||e)); }
  try{ await faceapi.nets.ageGenderNet.loadFromUri(new URL("age_gender_model.json",location.href).href); log("OK   model A loaded"); }catch(e){ log("FAIL model A: "+(e&&e.message||e)); }
  try{
    const h=new Human.Human({modelBasePath:new URL("./",location.href).href,backend:"webgl",face:{enabled:true,detector:{rotation:false},mesh:{enabled:true},iris:{enabled:false},attention:{enabled:false},description:{enabled:true},emotion:{enabled:false},antispoof:{enabled:false},liveness:{enabled:false}},body:{enabled:false},hand:{enabled:false},object:{enabled:false},gesture:{enabled:false},segmentation:{enabled:false}});
    await h.load(); log("OK   Human loaded, version="+h.version);
    const c=document.createElement("canvas"); c.width=c.height=256; const r=await h.detect(c); log("OK   Human detect ran, faces="+r.face.length);
  }catch(e){ log("FAIL model B / Human: "+(e&&e.message||e)); }
  log("DONE");
})();
</script></body></html>
